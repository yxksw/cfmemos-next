[build]
  command = "npm install && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  NEXT_TELEMETRY_DISABLED = "1"

# Next.js SSR 需要插件
[[plugins]]
  package = "@netlify/plugin-nextjs"

# SSR 重定向规则 - 由插件自动处理
# 不需要手动配置 /* 到 index.html 的重定向
